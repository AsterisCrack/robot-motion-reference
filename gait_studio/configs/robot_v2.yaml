# Robot description for Gait Studio.
# Paths are relative to this file.

mjcf: ../../../envs/assets/robotV2/robot_v2.xml
# The MJCF carries absolute Windows mesh paths; every mesh file is re-pointed here.
mesh_dir: ../../../envs/assets/robotV2/Robot_description/meshes

base_body: base_link
foot_bodies: {left: l_foot_link_1, right: r_foot_link_1}

# Joint order of the output table. Matches the Isaac Lab articulation order (L,R interleaved),
# see envs/isaaclab/biped_env_cfg.py BipedRobotV2EnvCfg. The env binds by name anyway.
joints:
  - l_hip_yaw
  - r_hip_yaw
  - l_hip_roll_joint
  - r_hip_roll_joint
  - l_hip_pitch_joint
  - r_hip_pitch_joint
  - l_knee_joint
  - r_knee_joint
  - l_ankle_roll_joint
  - r_ankle_roll_joint
  - l_ankle_pitch_joint
  - r_ankle_pitch_joint

# Training joint limits in degrees, same order. These are the action-mapping limits in
# envs/assets/robotV2/biped_robot.py (_JOINT_LIMITS_DEG): a reference outside them is
# unreachable by the policy no matter what.
joint_limits_deg:
  - [-45, 45]
  - [-45, 45]
  - [-25, 45]
  - [-25, 45]
  - [-90, 30]
  - [-90, 30]
  - [-120, 5]
  - [-120, 5]
  - [-60, 60]
  - [-60, 60]
  - [-35, 50]
  - [-35, 50]

# Feetech STS3215 as trained against: BAM fit (actuator/bam_kernel.py), mirrored in gait_studio/actuator.py.
# Keep these in sync with config/config.yaml (env.actuator). Stall, no-load speed, back-EMF slope and
# friction all come from the params file; nothing is hard-coded here.
actuator:
  params_file: ../../../actuator/params/sts3215_12v/m6.json   # relative to this file
  kp_fw: 32                 # firmware P register
  stall_torque_cap_nm: 2.94 # datasheet stall at 12 V, applied by raising R (no-load speed unchanged)
  vin: 12.0                 # nominal supply [V]; training samples 11.1-12.6. 12 V is where the cap is defined
  # Reflected rotor inertia for the torque estimate. null = take it from the params file (0.0234).
  armature: null

# Sole rectangle in the foot body frame, metres. Measured from the foot mesh at the zero pose
# (gait_studio.robot prints the measured values; override here if the mesh changes).
# lateral offset is outward-positive (mirrored for the right foot).
sole:
  auto: true

# Command space covered by the gait table (bake grid) and used to place the style anchors.
# NOT the old training ranges (vx up to 0.5): with the STS3215 speed/torque limits the analyzer
# found clean references only up to roughly |vx| 0.1, |vy| 0.08, |wz| 0.4 (measured with the
# pre-BAM 0.04 armature / 4.71 rad/s model; re-check against the BAM model); this
# grid stretches a bit past that and the bake report flags the cells that exceed the servo.
# Keep the training command ranges equal to this (config/config_gait_reference.yaml does).
command_ranges:
  vx: [-0.2, 0.2]
  vy: [-0.15, 0.15]
  wz: [-1.2, 1.2]

# Bake grid resolution (points per axis, ends included).
grid: {vx: 9, vy: 7, wz: 13}

# |v_xy| and |wz| below this -> standing pose, clock holds. Same as the training config's
# env_config.reference.stand_threshold.
stand_threshold: 0.05

control_dt: 0.02   # 50 Hz policy rate

# Table samples per gait cycle (even). The cycle length depends on the command (style cadence
# knobs), so the table is phase-normalised and carries a per-command clock frequency grid.
n_phase: 64
